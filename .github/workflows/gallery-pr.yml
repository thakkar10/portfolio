name: Gallery PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gallery-checks:
    name: Gallery lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint gallery code
        run: >-
          npx eslint
          src/app/admin/galleries
          src/app/api/admin/galleries
          src/app/api/galleries
          src/app/client-gallery/page.js
          src/app/g
          src/data/galleryDemo.js
          src/lib/clientGallery.js
          src/models/ClientGallery.js
          src/models/GallerySelection.js
      - name: Build application
        run: npm run build
