name: Gallery PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gallery-checks:
    name: Gallery lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint gallery code
        run: >-
          npx eslint
          src/app/admin/galleries
          src/app/api/admin/galleries
          src/app/api/auth/login/route.js
          src/app/api/auth/register/route.js
          src/app/api/auth/verify/route.js
          src/app/api/galleries
          src/app/client-gallery/page.js
          src/app/g
          src/data/galleryDemo.js
          src/lib/clientGallery.js
          src/lib/galleryUnlockLimit.js
          src/models/ClientGallery.js
          src/models/GallerySelection.js
          src/models/GalleryUnlockAttempt.js
          src/middleware/auth.js
      - name: Build application
        run: npm run build
